name: 🌱 WorkBuddy Daily


on:
  schedule:
    # 北京时间 07:00 / 12:00 / 23:30（GitHub cron 用 UTC，北京时间 = UTC+8）
    - cron: "30 22 * * *"→ Runs at 23:00     # 07:00
    - cron: "30 5 * * *"→ Runs at 04:00      # 12:00
    - cron: "30 19 * * *"→ Runs at 15:30    # 23:30
  workflow_dispatch:          # 支持手动触发


permissions:
  contents: write


concurrency:
  group: workbuddy
  cancel-in-progress: false


jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # mp 对话任务按真人节奏上报（每条 45s±10s），账号多时耗时更长
    env:
      TZ: Asia/Shanghai   # runner 默认 UTC：不加会把日志时间与补签日期算错一天
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install deps
        run: pip install requests


      - name: Restore benefit guard
