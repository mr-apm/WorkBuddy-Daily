# ⚠️ 本文件已针对「schedule 静默停摆」做过加固，改动点：
#   1) 新增 push 触发：改本文件/脚本即自动跑一次，便于验证，同时让仓库保持活跃
#   2) 新增 Debug trigger 步骤：日志首行打印 event/ref，区分「定时」还是「手动」
#   3) 新增公开仓库月度 keepalive：规避公开仓库 60 天无活动被自动禁用调度
#   4) 真正的准点保障请配合外部触发器（workbuddy-trigger-worker.js）

name: 🌱 WorkBuddy Daily

on:
  schedule:
    # 北京时间 07:17 / 12:17 / 23:37（GitHub cron 用 UTC，北京时间 = UTC+8）
    # 实测：本仓库 schedule 长期延迟 1~8 小时甚至整轮丢弃，不能作为准点依据
    - cron: "17 23 * * *"    # 北京 07:17
    - cron: "17 4 * * *"     # 北京 12:17
    - cron: "37 15 * * *"    # 北京 23:37
  workflow_dispatch:          # 支持手动 / 外部 API 触发
  push:                       # 改动即触发一次，方便验证 + 保持仓库活跃
    branches: [main]          # ⚠️ 默认分支若叫 master，改成 master
    paths:
      - ".github/workflows/workbuddy.yml"
      - "workbuddy_daily.py"
      - "workbuddy_intl_daily.py"

permissions:
  contents: write

concurrency:
  group: workbuddy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 国内 + 国际版串行执行，账号多时耗时更长
    env:
      TZ: Asia/Shanghai   # runner 默认 UTC：不加会把日志时间与补签日期算错一天
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug trigger
        run: |
          echo "event    = ${{ github.event_name }}"
          echo "ref      = ${{ github.ref }}"
          echo "schedule = ${{ github.event.schedule }}"
          echo "repo     = ${{ github.repository }} (private=${{ github.event.repository.private }})"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Restore benefit guard
        uses: actions/cache@v4
        with:
          path: workbuddy_benefit_state.json
          key: workbuddy-benefit-state-${{ github.run_id }}
          restore-keys: |
            workbuddy-benefit-state-

      - name: Detect account config
        id: config
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          WORKBUDDY_INTL_TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
        run: |
          if [ -n "$WORKBUDDY_REFRESH_TOKEN" ]; then
            echo "cn=true" >> "$GITHUB_OUTPUT"
          else
            echo "cn=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$WORKBUDDY_INTL_TOKENS" ] || [ -n "$WORKBUDDY_TOKEN" ]; then
            echo "intl=true" >> "$GITHUB_OUTPUT"
          else
            echo "intl=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run WorkBuddy
        if: steps.config.outputs.cn == 'true'
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WORKBUDDY_TASKS: ${{ secrets.WORKBUDDY_TASKS }}
          WORKBUDDY_SKIP_TASKS: ${{ secrets.WORKBUDDY_SKIP_TASKS }}
          WORKBUDDY_MP_GAP: ${{ secrets.WORKBUDDY_MP_GAP }}
          WORKBUDDY_MAKEUP_MAX_PER_RUN: ${{ secrets.WORKBUDDY_MAKEUP_MAX_PER_RUN }}
          WORKBUDDY_ACTIVITY_CHAT_FALLBACK: ${{ secrets.WORKBUDDY_ACTIVITY_CHAT_FALLBACK }}
          WORKBUDDY_NOTIFY: ${{ secrets.WORKBUDDY_NOTIFY }}
        run: python workbuddy_daily.py

      - name: Run WorkBuddy Intl
        if: ${{ always() && steps.config.outputs.intl == 'true' }}
        env:
          WORKBUDDY_INTL_TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
          WORKBUDDY_INTL_MODELS: ${{ secrets.WORKBUDDY_INTL_MODELS }}
          PLUSPLUS_TOKEN: ${{ secrets.PLUSPLUS_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WORKBUDDY_NOTIFY: ${{ secrets.WORKBUDDY_NOTIFY }}
        run: python workbuddy_intl_daily.py

      - name: No account configured
        if: ${{ always() && steps.config.outputs.cn != 'true' && steps.config.outputs.intl != 'true' }}
        run: echo "::warning::未配置 WORKBUDDY_REFRESH_TOKEN 或 WORKBUDDY_INTL_TOKENS/WORKBUDDY_TOKEN，跳过签到。"

      # ⚠️ 仅在【私有仓库】中持久化令牌/福利期次状态；公开仓库会跳过，避免 RT 泄露
      - name: Persist runtime state (private repo only)
        if: always() && github.event.repository.private == true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wb_refresh_tokens.json 2>/dev/null || true
          git add -f wb_intl_tokens.json 2>/dev/null || true
          git add -f workbuddy_benefit_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "运行状态无变化"
          else
            git commit -m "chore: 更新运行状态 [skip ci]"
            git push
          fi

      # 公开仓库的 schedule 在 60 天无活动后会被 GitHub 自动禁用。
      # 这里每月提交一次心跳（内容只写年月，同月内 diff 为空，天然去重）。
      - name: Keepalive (public repo schedule guard)
        if: always() && github.event_name == 'schedule' && github.event.repository.private == false
        run: |
          mkdir -p .github
          date -u +"%Y-%m" > .github/keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "本月心跳已存在，跳过"
          else
            git commit -m "chore: keepalive [skip ci]"
            git push
          fi
